[package]
name = "redns-matchers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
redns-core = { path = "../../core" }
aho-corasick = "1"
fastrand = "2"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
ipnet = "2"
maxminddb = "0.32"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
tracing = "0.1"
