[package]
name = "redns"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "redns"
path = "src/main.rs"

[dependencies]
redns-core = { path = "../core" }
redns-matchers = { path = "../plugins/matchers" }
redns-executables = { path = "../plugins/executables" }
clap = { version = "4", features = ["derive"] }
socket2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1", default-features = false, features = ["serialize", "deserialize"] }
serde_json = "1"
async-trait = "0.1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "0.1" }
libc = "0.2"

[features]
default = []
io-uring = ["redns-core/io-uring"]
